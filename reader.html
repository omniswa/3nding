<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>3NDING — Reader</title>
    <meta name="robots" content="noindex, follow" />
    <script src="scripts/jszip.js" defer></script>
    <link rel="stylesheet" href="styles/reader.css" />
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/worksans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/spacemono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/literata.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="apple-touch-icon.png" type="image/png" />
  </head>

  <body class="theme-paper">
    <div class="topbar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="topbar-inner">
        <a href="index.html" class="back-link" id="backLink">archive</a>
        <div class="topbar-title" id="topbarTitle">Loading…</div>
        <div class="progress-pct" id="progressPct">0%</div>
        <button
          class="settings-btn"
          id="settingsBtn"
          aria-label="Reading settings"
          aria-expanded="false"
        >
          &#9881;
        </button>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-label="Reading settings">
      <div class="drawer-head">
        <h2>Reading settings</h2>
        <button
          class="drawer-close"
          id="drawerCloseBtn"
          aria-label="Close settings"
        >
          &#10005;
        </button>
      </div>

      <div class="setting-group">
        <span class="setting-label">Font</span>
        <div class="option-row" id="fontRow" data-key="font">
          <button class="opt-btn" data-value="serif">Serif</button>
          <button class="opt-btn" data-value="sans">Sans</button>
          <button class="opt-btn" data-value="mono">Mono</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Text size</span>
        <div class="size-row">
          <button class="opt-btn" id="sizeDown" aria-label="Decrease text size">
            A-
          </button>
          <span class="size-value" id="sizeValue">17</span>
          <button class="opt-btn" id="sizeUp" aria-label="Increase text size">
            A+
          </button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Alignment</span>
        <div class="option-row" id="alignRow" data-key="align">
          <button class="opt-btn" data-value="left">Left</button>
          <button class="opt-btn" data-value="justify">Justify</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">Theme</span>
        <div class="option-row" id="themeRow" data-key="theme">
          <button class="opt-btn" data-value="paper">Paper</button>
          <button class="opt-btn" data-value="sepia">Sepia</button>
          <button class="opt-btn" data-value="dark">Dark</button>
        </div>
      </div>

      <button class="reset-btn" id="resetBtn">Reset to defaults</button>

      <div class="sync-row" id="accountRow">
        <span class="setting-label">Account</span>
        <p class="sync-status" id="accountEmail">Signed in</p>
        <div class="sync-actions">
          <button type="button" class="opt-btn" id="cloudSaveBtn">
            Save to cloud
          </button>
          <button type="button" class="opt-btn" id="cloudLoadBtn">
            Load from cloud
          </button>
        </div>
        <p
          class="sync-note"
          id="syncStatus"
          role="status"
          aria-live="polite"
        ></p>
        <button type="button" class="opt-btn" id="signOutBtn">Sign out</button>
      </div>

      <a href="pages/support.html" class="drawer-support-link"
        >Support the archive &rarr;</a
      >
    </aside>

    <div class="reader-surface" id="readerSurface">
      <div class="state-box" id="stateBox">
        <span class="dot"></span> Opening the book…
      </div>
    </div>

    <script src="scripts/firebase-config.js" defer></script>
    <script src="scripts/auth.js" data-auth="optional" defer></script>
    <script src="scripts/reader.js" defer></script>
  </body>
</html>
